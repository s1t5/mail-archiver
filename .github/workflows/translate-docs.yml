name: Translate documentation

# Translates changed English pages into every locale that exists in
# Resources/SharedResource.*.resx and opens or updates a pull request with the
# result. English stays the source of truth; the translated files are plain
# Markdown next to their source and are reviewed like any other change.
#
# Required repository configuration:
#   secret   LLM_API_KEY    key for the chat-completions endpoint
#   variable LLM_BASE_URL   base URL, for example https://api.example.com/v1
#   variable LLM_MODEL      model name, for example gpt-4o-mini
#
# When LLM_API_KEY is absent the job still builds the site and exits without a
# translation PR, so forks and fresh checkouts stay green.

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Translate one locale only, for example de. Leave empty for all locales."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'tools/translate_docs.py'
      - 'doc/i18n/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  # The first full run covers 38 pages in 12 locales and does not fit into a
  # single job. Each locale is committed separately, so an interrupted run keeps
  # everything it finished and this schedule continues with the rest.
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-translations
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The revision-date plugin needs the full history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Translate and commit each locale
        # Stops before the six hour job limit. A locale is committed as soon as
        # it is finished, so the next run continues instead of starting over.
        timeout-minutes: 350
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LANGUAGE: ${{ inputs.language }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Continue on the existing translation branch so a second run does
          # not throw away the locales the first one already committed.
          if git ls-remote --exit-code --heads origin docs/translations >/dev/null 2>&1; then
            git fetch origin docs/translations
            git checkout -B docs/translations origin/docs/translations
          else
            git checkout -B docs/translations
          fi

          if [ -n "${LANGUAGE:-}" ]; then
            LANGS="$LANGUAGE"
          else
            LANGS=$(ls Resources/SharedResource.*.resx \
              | sed -E 's/.*SharedResource\.(.*)\.resx/\1/' \
              | grep -v '^en-GB$' \
              | sort)
          fi

          DEADLINE=$((SECONDS + 18000))
          for lang in $LANGS; do
            REMAINING=$((DEADLINE - SECONDS))
            if [ "$REMAINING" -le 120 ]; then
              echo "Time budget reached before $lang."
              break
            fi

            echo "::group::Translate $lang"
            python tools/translate_docs.py --lang "$lang" --nav --max-seconds "$REMAINING"
            echo "::endgroup::"

            git add doc
            if git diff --cached --quiet; then
              echo "No changes for $lang."
              continue
            fi

            git commit -m "docs: update $lang translations"
            git push origin docs/translations

            if ! gh pr view docs/translations >/dev/null 2>&1; then
              gh pr create \
                --base main \
                --head docs/translations \
                --title "docs: update translations" \
                --body "Automated translation update. English remains the source of truth; review the generated pages before merging."
            fi
          done

      - name: Build site
        # Runs after the commits: git-revision-date-localized needs a commit for
        # every new page, and --strict turns a missing date into a failure.
        run: mkdocs build --strict
