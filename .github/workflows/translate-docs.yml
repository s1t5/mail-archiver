name: Translate documentation

# Translates changed English pages into every locale that exists in
# Resources/SharedResource.*.resx and opens or updates a pull request with the
# result. English stays the source of truth; the translated files are plain
# Markdown next to their source and are reviewed like any other change.
#
# Required repository configuration:
#   secret   LLM_API_KEY    key for the chat-completions endpoint
#   variable LLM_BASE_URL   base URL, for example https://api.example.com/v1
#   variable LLM_MODEL      model name, for example gpt-4o-mini
#
# When LLM_API_KEY is absent the job still builds the site and exits without a
# translation PR, so forks and fresh checkouts stay green.

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Translate one locale only, for example de. Leave empty for all locales."
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - 'doc/**'
      - 'tools/translate_docs.py'
      - 'doc/i18n/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
  # The first full run covers 38 pages in 12 locales and does not fit into a
  # single job. The script stops at its time budget, commits the progress, and
  # this schedule picks the remaining pages up on the next run.
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-translations
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The revision-date plugin needs the full history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Translate changed pages
        # Stops before the six hour job limit and leaves the remaining pages to
        # the next scheduled run.
        timeout-minutes: 350
        env:
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          if [ -n "$LANGUAGE" ]; then
            python tools/translate_docs.py --lang "$LANGUAGE" --nav --max-seconds 18000
          else
            python tools/translate_docs.py --all --nav --max-seconds 18000
          fi

      - name: Commit translations
        id: commit
        run: |
          set -euo pipefail
          git add doc
          if git diff --cached --quiet; then
            echo "No translation changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update translations"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build site
        # Runs after the commit: git-revision-date-localized needs a commit for
        # every new page, and --strict turns a missing date into a failure.
        run: mkdocs build --strict

      - name: Open or update translation pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git checkout -B docs/translations
          git push --force origin docs/translations
          if ! gh pr view docs/translations >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head docs/translations \
              --title "docs: update translations" \
              --body "Automated translation update. English remains the source of truth; review the generated pages before merging."
          else
            echo "Translation pull request already exists and was updated by the push."
          fi
