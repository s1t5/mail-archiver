# Notice shown on machine-translated documentation pages.
#
# {link} is replaced at build time with a Markdown link to the English
# original. Keep the placeholder in every body. The English source page never
# shows a notice, so there is no "en" entry here.

translated:
  de:
    title: "Maschinelle Übersetzung"
    body: "Diese Seite wurde automatisch aus dem englischen Original übersetzt. Maßgeblich ist die {link}."
    link_text: "englische Fassung"
  es:
    title: "Traducción automática"
    body: "Esta página se tradujo automáticamente del original en inglés. La {link} es la fuente autorizada."
