version: '3.8'

networks:
  postgres:

services:
  mailarchive-app:
    build: .
    restart: always
    ports:
      - "5000:5000"
    networks:
      - postgres
    environment:
      # Admin API key used by the container health check. Leave empty on the first start,
      # create a key under /ApiKeys, then put it in .env and restart. The container stays
      # unhealthy until the key is present and Api:Enabled is true.
      MAILARCHIVER_HEALTH_API_KEY: ${MAILARCHIVER_HEALTH_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $$MAILARCHIVER_HEALTH_API_KEY\" http://localhost:5000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      # Uncomment the following line to mount a directory for local file imports
      # (also add the path to appsettings.json: LocalImport.AllowedPaths)
      # - /path/to/your/mbox/files:/data/import
      - ./appsettings.json:/app/appsettings.json
      - ./logs:/app/logs
      - ./data-protection-keys:/app/DataProtection-Keys
      # Uncomment when RawMessages.Storage=filesystem: the stored original messages live
      # here, and without this mount they are lost when the container is recreated.
      # - ./raw-messages:/app/RawMessages
    depends_on:
      - postgres

  postgres:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_DB: MailArchiver
      POSTGRES_USER: mailuser
      POSTGRES_PASSWORD: masterkey
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailuser -d MailArchiver"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
