site_name: Mail-Archiver Documentation
site_description: Documentation for Mail-Archiver — self-hosted email archiving, search and export.
site_url: https://s1t5.github.io/mail-archiver/
site_author: s1t5
copyright: Copyright &copy; s1t5 — GPL-3.0

repo_url: https://github.com/s1t5/mail-archiver
repo_name: s1t5/mail-archiver
edit_uri: edit/main/doc/

docs_dir: doc
hooks:
  - hooks.py

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  # Shows "Last updated" / "Created" per page, taken from git history.
  # Requires a full clone: actions/checkout must use fetch-depth: 0, otherwise
  # every page silently falls back to the build date.
  - git-revision-date-localized:
      type: date
      enable_creation_date: true
      locale: en
      fallback_to_build_date: false

nav:
  # The grouping here mirrors the sections on the landing page (doc/index.md).
  # Keep the two in sync: navigation.tabs turns these into the top tab bar.
  - Home: index.md
  - Installation & Maintenance:
      - Setup and Parameters: Setup.md
      - Reverse Proxy: ReverseProxy.md
      - PostgreSQL Major Upgrade: PostgreSQLUpgrade.md
      - Database Maintenance: DatabaseMaintenance.md
      - Backup and Restore: BackupRestore.md
      - Local Test Environment: LocalTestEnvironment.md
  - Getting Mail In:
      - Account Import: Account-Import.md
      - Mail Synchronization: Synchronization.md
      - CLI Local Import: CLI-Local-Import.md
      - Web Import (EML / MBox): Import-EML-MBox.md
      - Rate Limit Handling: RateLimitHandling.md
  - Working with the Archive:
      - Mail Search: Search.md
      - Background Jobs: BackgroundJobs.md
      - Mailbox Migration: MailboxMigration.md
      - Account Export (EML / MBox): Export-Account.md
      - Attachment Deduplication: AttachmentDeduplication.md
      - Date-Windowed Offload: Offload.md
      - Per-Account Storage: AccountStorage.md
  - Administration & Security:
      - User Management & Permissions: UserManagement.md
      - Two-Factor Authentication: TwoFactor.md
      - OIDC / SSO: OIDC_Implementation.md
      - Access Logging: Logs.md
      - Audit Data Export: AuditExport.md
      - Emergency Account Recovery: EmergencyAccountRecovery.md
      - Retention Policies: RetentionPolicies.md
  - Provider Guides:
      - Azure App Registration (M365): AZURE_APP_REGISTRATION_M365.md
      - M365 Tenant Mailbox Import: M365TenantImport.md
      - Personal Microsoft Accounts: MSA_Outlook_Setup.md
      - Gmail Best Practices: GmailBestPractices.md
      - Yahoo Mail Limitations: YahooMailExportLimitations.md
  - Programmatic Access:
      - REST API: API.md
      - API Reference: API-Reference.md
      - MCP Server: MCP.md
  - Operations & Development:
      - Language and Localization: Localization.md
      - Docker Compose Logs: DockerComposeLogs.md
      - Dev Tag (Development Versions): DevTag.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/s1t5/mail-archiver
    - icon: fontawesome/solid/globe
      link: https://mail-archiver.org

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # Mermaid is self-hosted so the site has no third-party CDN dependency at
  # view time. Material checks for a global `mermaid` when it renders a
  # diagram and only falls back to unpkg.com when it finds none, so shipping
  # the library here keeps diagrams working on networks without CDN access.
  # defer keeps the (large) file from blocking the parser.
  - path: assets/javascripts/mermaid.min.js
    defer: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
